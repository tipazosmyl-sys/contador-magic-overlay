<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Overlay Counter</title>
    <style>
        /* ===== ESTILOS UNIFORMES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .overlay-container {
            background: rgba(0, 0, 0, 0.50);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 12px 20px 12px 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.9);
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 230px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            -webkit-app-region: drag;
        }

        .close-btn {
            position: absolute;
            top: 5px;
            right: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: none;
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-app-region: no-drag;
        }

        .close-btn:hover {
            background: rgba(255, 68, 68, 0.8);
            color: white;
        }

        .container {
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
            width: 100%;
            flex: 1;
            padding: 2px 0;
        }

        .player {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            min-width: 110px;
            flex: 1;
        }

        /* ===== TODOS LOS CUADROS CON EL MISMO FONDO ===== */
        .player-label {
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1.5px;
            padding: 4px 16px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.5);  /* ← MISMO FONDO */
            border: 1px solid rgba(255, 255, 255, 0.08);
            cursor: pointer;
            transition: all 0.2s ease;
            -webkit-app-region: no-drag;
            width: 100%;
            text-align: center;
        }

        .player-label:hover {
            background: rgba(0, 0, 0, 0.7);
            border-color: rgba(255, 255, 255, 0.15);
            transform: scale(1.02);
        }

        .player-label:active {
            transform: scale(0.95);
        }

        .player1 .player-label {
            color: #ff6b6b;
        }

        .player2 .player-label {
            color: #4ecdc4;
        }

        .player-name-input {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 8px;
            padding: 4px 10px;
            color: white;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            font-family: 'Segoe UI', sans-serif;
            width: 100%;
            display: none;
            -webkit-app-region: no-drag;
        }

        .player-name-input:focus {
            outline: none;
            border-color: rgba(255, 215, 0, 0.6);
            background: rgba(0, 0, 0, 0.7);
        }

        .player-name-input.active {
            display: block;
        }

        .life-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 6px 16px 8px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            min-width: 80px;
            min-height: 70px;
            gap: 3px;
            width: 100%;
        }

        .life-value {
            color: #fff;
            font-size: 44px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.1);
            line-height: 1;
            min-width: 55px;
            text-align: center;
        }

        .life-value.negative {
            color: #ff4444;
            text-shadow: 0 0 40px rgba(255, 0, 0, 0.4);
        }

        .life-value.low-life {
            animation: pulse 1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .life-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-life {
            border: none;
            border-radius: 6px;
            padding: 2px 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.15s ease;
            width: 32px;
            height: 26px;
            text-align: center;
            font-family: 'Segoe UI', sans-serif;
            -webkit-app-region: no-drag;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-life:active {
            transform: scale(0.9);
        }

        .btn-damage {
            background: #ff4444;
            color: white;
            box-shadow: 0 2px 10px rgba(255, 68, 68, 0.3);
        }

        .btn-damage:hover {
            background: #ff2222;
            box-shadow: 0 2px 15px rgba(255, 68, 68, 0.5);
        }

        .btn-heal {
            background: #44ff88;
            color: #000;
            box-shadow: 0 2px 10px rgba(68, 255, 136, 0.3);
        }

        .btn-heal:hover {
            background: #22ff77;
            box-shadow: 0 2px 15px rgba(68, 255, 136, 0.5);
        }

        /* ===== INPUTS "1" CON EL MISMO FONDO ===== */
        .damage-input-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .damage-input {
            background: rgba(0, 0, 0, 0.5);  /* ← MISMO FONDO */
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 4px 8px;
            color: white;
            font-size: 16px;
            width: 50px;
            height: 30px;
            text-align: center;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            -webkit-app-region: no-drag;
        }

        .damage-input:focus {
            outline: none;
            border-color: rgba(255, 215, 0, 0.3);
            background: rgba(0, 0, 0, 0.7);
        }

        .damage-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
        }

        .damage-input[type="number"] {
            -moz-appearance: textfield;
        }

        /* ===== MARCADOR CON EL MISMO FONDO ===== */
        .score-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 4px 0;
            -webkit-app-region: no-drag;
            width: 100%;
        }

        .score-display {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 20px;
            background: rgba(0, 0, 0, 0.5);  /* ← MISMO FONDO */
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .score-display:hover {
            background: rgba(0, 0, 0, 0.7);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .score-number {
            font-size: 20px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            min-width: 22px;
            text-align: center;
            transition: all 0.2s ease;
            cursor: pointer;
            padding: 0 2px;
        }

        .score-number.p1 {
            color: #ff6b6b;
        }

        .score-number.p2 {
            color: #4ecdc4;
        }

        .score-number:hover {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }

        .score-dash {
            color: rgba(255, 255, 255, 0.2);
            font-size: 18px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            padding: 0 2px;
        }

        .score-input {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 6px;
            padding: 0 4px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            font-family: 'Courier New', monospace;
            width: 32px;
            height: 30px;
            display: none;
            -webkit-app-region: no-drag;
        }

        .score-input:focus {
            outline: none;
            border-color: rgba(255, 215, 0, 0.6);
            background: rgba(0, 0, 0, 0.7);
        }

        .score-input.active {
            display: inline-block;
        }

        .score-number.hidden {
            display: none;
        }

        .bottom-controls {
            display: flex;
            gap: 10px;
            margin-top: 4px;
            -webkit-app-region: no-drag;
        }

        .btn-reset {
            background: rgba(255, 170, 0, 0.15);
            color: #ffaa00;
            border: 1px solid rgba(255, 170, 0, 0.2);
            padding: 4px 22px;
            font-size: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 1px;
            height: 28px;
        }

        .btn-reset:hover {
            background: rgba(255, 170, 0, 0.25);
            border-color: rgba(255, 170, 0, 0.4);
            transform: scale(1.05);
        }

        .btn-reset:active {
            transform: scale(0.95);
        }

        .vs-divider {
            color: rgba(255, 255, 255, 0.15);
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            padding: 0 3px;
        }

        .damage-flash {
            animation: flashRed 0.3s ease;
        }

        @keyframes flashRed {
            0% { background: rgba(255, 0, 0, 0.3); }
            100% { background: rgba(0, 0, 0, 0.5); }
        }

        .heal-flash {
            animation: flashGreen 0.3s ease;
        }

        @keyframes flashGreen {
            0% { background: rgba(0, 255, 0, 0.2); }
            100% { background: rgba(0, 0, 0, 0.5); }
        }

        .score-pop {
            animation: popScore 0.3s ease;
        }

        @keyframes popScore {
            0% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        ::-webkit-scrollbar {
            display: none;
        }

        @media (max-width: 450px) {
            .container { gap: 12px; }
            .life-value { font-size: 34px; }
            .player { min-width: 80px; }
            .overlay-container { padding: 10px 12px; min-height: 200px; }
            .life-container { min-width: 60px; min-height: 60px; padding: 4px 10px; }
            .btn-life { width: 28px; height: 22px; font-size: 13px; }
            .damage-input { width: 40px; height: 26px; font-size: 14px; }
            .player-label { font-size: 12px; padding: 3px 12px; }
            .btn-reset { font-size: 10px; padding: 2px 16px; height: 24px; }
            .score-number { font-size: 16px; min-width: 16px; }
            .score-display { padding: 2px 12px; }
            .score-input { font-size: 16px; width: 26px; height: 26px; }
        }
    </style>
</head>
<body>
    <div class="overlay-container">
        <button class="close-btn" id="closeBtn" title="Cerrar">✕</button>

        <div class="container">
            <!-- Jugador 1 -->
            <div class="player player1">
                <div class="player-label" id="label1" onclick="editName(1)">JUGADOR 1</div>
                <input type="text" class="player-name-input" id="nameInput1" maxlength="20" 
                       onblur="saveName(1)" onkeydown="if(event.key==='Enter')saveName(1)">
                <div class="life-container" id="lifeContainer1">
                    <div class="life-value" id="life1">20</div>
                    <div class="life-buttons">
                        <button class="btn-life btn-damage" data-player="1" data-action="damage">−</button>
                        <button class="btn-life btn-heal" data-player="1" data-action="heal">+</button>
                    </div>
                </div>
                <div class="damage-input-container">
                    <input type="number" class="damage-input" id="damageInput1" value="1" min="1" max="999">
                </div>
            </div>

            <div class="vs-divider">⚔️</div>

            <!-- Jugador 2 -->
            <div class="player player2">
                <div class="player-label" id="label2" onclick="editName(2)">JUGADOR 2</div>
                <input type="text" class="player-name-input" id="nameInput2" maxlength="20"
                       onblur="saveName(2)" onkeydown="if(event.key==='Enter')saveName(2)">
                <div class="life-container" id="lifeContainer2">
                    <div class="life-value" id="life2">20</div>
                    <div class="life-buttons">
                        <button class="btn-life btn-damage" data-player="2" data-action="damage">−</button>
                        <button class="btn-life btn-heal" data-player="2" data-action="heal">+</button>
                    </div>
                </div>
                <div class="damage-input-container">
                    <input type="number" class="damage-input" id="damageInput2" value="1" min="1" max="999">
                </div>
            </div>
        </div>

        <!-- Marcador -->
        <div class="score-section">
            <div class="score-display" id="scoreDisplay">
                <span class="score-number p1" id="score1Label">0</span>
                <input type="number" class="score-input" id="score1Input" min="0" max="999" value="0">
                <span class="score-dash">-</span>
                <span class="score-number p2" id="score2Label">0</span>
                <input type="number" class="score-input" id="score2Input" min="0" max="999" value="0">
            </div>
        </div>

        <!-- Reset -->
        <div class="bottom-controls">
            <button class="btn-reset" id="resetBtn">🔄 RESET</button>
        </div>
    </div>

    <script>
        // ============================================
        // 1. CONFIGURACIÓN
        // ============================================
        const MAX_LIFE = 999;
        const MIN_LIFE = -999;

        // ============================================
        // 2. ESTADO DEL JUEGO
        // ============================================
        let life1 = 20;
        let life2 = 20;
        let name1 = 'JUGADOR 1';
        let name2 = 'JUGADOR 2';
        let score1 = 0;
        let score2 = 0;

        // ============================================
        // 3. REFERENCIAS
        // ============================================
        const lifeEl1 = document.getElementById('life1');
        const lifeEl2 = document.getElementById('life2');
        const label1 = document.getElementById('label1');
        const label2 = document.getElementById('label2');
        const nameInput1 = document.getElementById('nameInput1');
        const nameInput2 = document.getElementById('nameInput2');
        const damageInput1 = document.getElementById('damageInput1');
        const damageInput2 = document.getElementById('damageInput2');
        const resetBtn = document.getElementById('resetBtn');
        const closeBtn = document.getElementById('closeBtn');
        const score1Label = document.getElementById('score1Label');
        const score2Label = document.getElementById('score2Label');
        const score1Input = document.getElementById('score1Input');
        const score2Input = document.getElementById('score2Input');

        // ============================================
        // 4. FUNCIÓN: ACTUALIZAR PANTALLA
        // ============================================
        function updateDisplay() {
            lifeEl1.textContent = life1;
            lifeEl2.textContent = life2;

            lifeEl1.className = 'life-value' + (life1 < 0 ? ' negative' : '') + (life1 <= 5 && life1 > 0 ? ' low-life' : '');
            lifeEl2.className = 'life-value' + (life2 < 0 ? ' negative' : '') + (life2 <= 5 && life2 > 0 ? ' low-life' : '');

            score1Label.textContent = score1;
            score2Label.textContent = score2;
            score1Input.value = score1;
            score2Input.value = score2;

            try {
                localStorage.setItem('magicOverlay_life1', life1);
                localStorage.setItem('magicOverlay_life2', life2);
                localStorage.setItem('magicOverlay_name1', name1);
                localStorage.setItem('magicOverlay_name2', name2);
                localStorage.setItem('magicOverlay_score1', score1);
                localStorage.setItem('magicOverlay_score2', score2);
            } catch(e) {}
        }

        // ============================================
        // 5. CAMBIAR NOMBRE
        // ============================================
        function editName(player) {
            if (player === 1) {
                label1.style.display = 'none';
                nameInput1.style.display = 'block';
                nameInput1.value = name1;
                nameInput1.focus();
                nameInput1.select();
            } else if (player === 2) {
                label2.style.display = 'none';
                nameInput2.style.display = 'block';
                nameInput2.value = name2;
                nameInput2.focus();
                nameInput2.select();
            }
        }

        function saveName(player) {
            if (player === 1) {
                const newName = nameInput1.value.trim() || 'JUGADOR 1';
                name1 = newName.toUpperCase();
                label1.textContent = name1;
                label1.style.display = 'block';
                nameInput1.style.display = 'none';
            } else if (player === 2) {
                const newName = nameInput2.value.trim() || 'JUGADOR 2';
                name2 = newName.toUpperCase();
                label2.textContent = name2;
                label2.style.display = 'block';
                nameInput2.style.display = 'none';
            }
            updateDisplay();
        }

        // ============================================
        // 6. CAMBIAR VIDA
        // ============================================
        function changeLife(player, amount) {
            if (player === 1) {
                let newLife = life1 + amount;
                life1 = Math.min(Math.max(newLife, MIN_LIFE), MAX_LIFE);
                updateDisplay();
                const container = document.getElementById('lifeContainer1');
                container.classList.remove('damage-flash', 'heal-flash');
                void container.offsetWidth;
                container.classList.add(amount < 0 ? 'damage-flash' : 'heal-flash');
            } else if (player === 2) {
                let newLife = life2 + amount;
                life2 = Math.min(Math.max(newLife, MIN_LIFE), MAX_LIFE);
                updateDisplay();
                const container = document.getElementById('lifeContainer2');
                container.classList.remove('damage-flash', 'heal-flash');
                void container.offsetWidth;
                container.classList.add(amount < 0 ? 'damage-flash' : 'heal-flash');
            }
        }

        // ============================================
        // 7. MARCADOR EDITABLE
        // ============================================
        function editScore(player) {
            if (player === 1) {
                score1Label.classList.add('hidden');
                score1Input.classList.add('active');
                score1Input.focus();
                score1Input.select();
            } else if (player === 2) {
                score2Label.classList.add('hidden');
                score2Input.classList.add('active');
                score2Input.focus();
                score2Input.select();
            }
        }

        function saveScore(player) {
            if (player === 1) {
                const value = parseInt(score1Input.value);
                if (!isNaN(value) && value >= 0 && value <= 999) {
                    score1 = value;
                } else {
                    score1Input.value = score1;
                }
                score1Label.classList.remove('hidden');
                score1Input.classList.remove('active');
                updateDisplay();
                const scoreDisplay = document.querySelector('.score-display');
                scoreDisplay.classList.remove('score-pop');
                void scoreDisplay.offsetWidth;
                scoreDisplay.classList.add('score-pop');
            } else if (player === 2) {
                const value = parseInt(score2Input.value);
                if (!isNaN(value) && value >= 0 && value <= 999) {
                    score2 = value;
                } else {
                    score2Input.value = score2;
                }
                score2Label.classList.remove('hidden');
                score2Input.classList.remove('active');
                updateDisplay();
                const scoreDisplay = document.querySelector('.score-display');
                scoreDisplay.classList.remove('score-pop');
                void scoreDisplay.offsetWidth;
                scoreDisplay.classList.add('score-pop');
            }
        }

        // ============================================
        // 8. RESET (SOLO VIDA)
        // ============================================
        function resetLife(value = 20) {
            if (life1 === value && life2 === value) {
                return;
            }
            life1 = value;
            life2 = value;
            updateDisplay();
            document.querySelectorAll('.life-container').forEach(el => {
                el.classList.remove('damage-flash', 'heal-flash');
                void el.offsetWidth;
                el.classList.add('heal-flash');
            });
            if (navigator.vibrate) navigator.vibrate(30);
        }

        // ============================================
        // 9. EVENTOS
        // ============================================

        document.querySelectorAll('.btn-damage, .btn-heal').forEach(btn => {
            btn.addEventListener('click', () => {
                const player = parseInt(btn.dataset.player);
                const action = btn.dataset.action;
                let amount;
                if (player === 1) {
                    amount = parseInt(damageInput1.value) || 1;
                } else if (player === 2) {
                    amount = parseInt(damageInput2.value) || 1;
                }
                amount = Math.min(Math.max(amount, 1), 999);

                if (action === 'damage') {
                    changeLife(player, -amount);
                } else if (action === 'heal') {
                    changeLife(player, amount);
                }
            });
        });

        score1Label.addEventListener('click', () => editScore(1));
        score2Label.addEventListener('click', () => editScore(2));

        score1Input.addEventListener('blur', () => saveScore(1));
        score1Input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                saveScore(1);
            }
        });

        score2Input.addEventListener('blur', () => saveScore(2));
        score2Input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                saveScore(2);
            }
        });

        resetBtn.addEventListener('click', () => resetLife(20));

        closeBtn.addEventListener('click', () => {
            window.close();
        });

        // ============================================
        // 10. TECLAS RÁPIDAS
        // ============================================
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === '1') {
                e.preventDefault();
                const amount = parseInt(damageInput1.value) || 1;
                changeLife(1, -amount);
            }
            if (e.ctrlKey && e.key === '2') {
                e.preventDefault();
                const amount = parseInt(damageInput2.value) || 1;
                changeLife(2, -amount);
            }
            if (e.shiftKey && e.key === '1') {
                e.preventDefault();
                const amount = parseInt(damageInput1.value) || 1;
                changeLife(1, amount);
            }
            if (e.shiftKey && e.key === '2') {
                e.preventDefault();
                const amount = parseInt(damageInput2.value) || 1;
                changeLife(2, amount);
            }
            if (e.key === 'r' && !e.ctrlKey && !e.shiftKey && !e.altKey) {
                e.preventDefault();
                resetLife(20);
            }
            if (e.key === 'Escape') {
                window.close();
            }
        });

        // ============================================
        // 11. CARGA INICIAL
        // ============================================
        try {
            const savedLife1 = localStorage.getItem('magicOverlay_life1');
            const savedLife2 = localStorage.getItem('magicOverlay_life2');
            const savedName1 = localStorage.getItem('magicOverlay_name1');
            const savedName2 = localStorage.getItem('magicOverlay_name2');
            const savedScore1 = localStorage.getItem('magicOverlay_score1');
            const savedScore2 = localStorage.getItem('magicOverlay_score2');
            
            if (savedLife1 !== null) life1 = parseInt(savedLife1) || 20;
            if (savedLife2 !== null) life2 = parseInt(savedLife2) || 20;
            if (savedName1) {
                name1 = savedName1;
                label1.textContent = name1;
            }
            if (savedName2) {
                name2 = savedName2;
